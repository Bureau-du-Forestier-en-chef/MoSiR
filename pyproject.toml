# Configuration du package MoSiR
#
# Remplace setup.py + requirements.txt.
#
# Les dépendances de [project] dependencies doivent rester identiques à
# celles de environment.yml : tests/test_Packaging.py échoue si elles
# divergent.

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "MoSiR"
version = "1.1.0"
description = "Modèle de Simulation en Réseau : devenir du carbone des produits du bois"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "LiLiQ-R-1.1" }
authors = [
    { name = "Gabriel Landry" }, 
    { email = "gabriel.landry@fec.gouv.qc.ca" },
]

dependencies = [
    # --- Interface web ---
    "flask>=2.2",
    "flask-cors>=3.0",
    "werkzeug>=2.2",
    "requests>=2.28",
    "python-dotenv>=0.21",
    "pyvis>=0.3",

    # --- Calculateur ---
    "networkx>=2.8",
    "numpy>=1.23",
    "pandas>=1.5",
    "scipy>=1.10",
    "seaborn>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.1",
    "pytest-cov>=4.0",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/Bureau-du-Forestier-en-chef/MoSiR"
Documentation = "https://github.com/Bureau-du-Forestier-en-chef/MoSiR/wiki"
Issues = "https://github.com/Bureau-du-Forestier-en-chef/MoSiR/issues"

[project.scripts]
MoSiR = "MoSiR.MoSiR:main"

[tool.setuptools.packages.find]
include = ["MoSiR*"]

[tool.setuptools.package-data]
MoSiR = [
    "mirowrapper/**",
    "static/**",
    "templates/*",
    "gamma_distribution/*",
    "uploads/*",
    "visualization/**",
    "radiative_forcing/*",
    "BFECGCBM/**",
    "examples/**",
    "./README.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "slow: tests longs (boucles sur plusieurs centaines de timesteps)",
]

[tool.coverage.run]
source = ["MoSiR"]
omit = [
    "*/mirowrapper/*",
    "*/visualization/*",
    "*/upload/*",
    "*/download/*",
    "*/reporting/views.py",
    "*/stats/*",
]
